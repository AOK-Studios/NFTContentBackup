[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nft-content-backup"
version = "0.1.0"
description = "Back up NFT metadata and the original IPFS media from a wallet address. No wallet connection, no keys."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
nftbackup = "nftbackup.cli:main"

[tool.setuptools.packages.find]
include = ["nftbackup*"]
